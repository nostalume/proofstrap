schema = 1
bindings = ["linux"]
packages = ["curl", "flatpak:org.example.App", "zypper:libfoo:amd64"]
hostname = "workstation"
timezone = "Asia/Shanghai"

profiles = [
  { profile = "core:desktop", arguments = { account = { account = "alice" }, group = { group = "users" } } },
  { profile = "core:server" },
]

memberships = [
  { account = "alice", group = "audio", present = true },
]

[sources]
core = "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
linux = "sha256:abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789"

[via]
flatpak = ["flatpak"]

[groups.users]
gid = 1000

[groups.audio]

[accounts.alice]
uid = 1000
group = "users"
home = "/home/alice"
mode = "0700"
shell = "/bin/bash"
locked = true

[accounts.operator]

[services.dbus]
target = "system"
packages = ["dbus"]
running = true

[services."systemd:pipewire"]
target = "user:alice"
packages = ["pipewire"]
enabled = true
running = false
