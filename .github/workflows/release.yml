name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Build reproducible Linux archives
        run: |
          test/official/stage-assets.sh "$RUNNER_TEMP/packs"
          test/release/build.sh dist "$RUNNER_TEMP/packs"
      - name: Add installer
        run: cp install.sh dist/install.sh

      - name: Inspect release contents
        run: |
          set -eu
          for arch in amd64 arm64; do
            name="proofstrap_linux_${arch}"
            tar -tzf "dist/$name.tar.gz" > "$RUNNER_TEMP/$name.files"
            test "$(wc -l < "$RUNNER_TEMP/$name.files")" -eq 11
            for member in \
              "$name/proofstrap" \
              "$name/README.md" \
              "$name/LICENSE" \
              "$name/spec/config.md" \
              "$name/spec/profile.md" \
              "$name/packs/" \
              "$name/packs/sha256/"; do
              grep -Fx "$member" "$RUNNER_TEMP/$name.files"
            done
            test "$(grep -Ec "^$name/packs/sha256/[0-9a-f]{64}\.pstrap$" "$RUNNER_TEMP/$name.files")" -eq 2

            author="proofstrap-pack_linux_${arch}"
            tar -tzf "dist/$author.tar.gz" > "$RUNNER_TEMP/$author.files"
            test "$(wc -l < "$RUNNER_TEMP/$author.files")" -eq 6
            for member in \
              "$author/" \
              "$author/proofstrap-pack" \
              "$author/README.md" \
              "$author/LICENSE" \
              "$author/spec/" \
              "$author/spec/profile.md"; do
              grep -Fx "$member" "$RUNNER_TEMP/$author.files"
            done
          done
          (
            cd dist
            sha256sum --check checksums.txt
          )

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: dist/*

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            printf 'release already exists: %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
