name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Check source shape
        run: |
          set -eu
          test -z "$(gofmt -l cmd internal)"
          test ! -d internal/proofstrap
          if rg -n 'internal/proofstrap|_create-home|proofstrap modules|replan_required' \
            cmd internal README.md docs/architecture.md docs/AGENTS.md spec \
            --glob '!**/*_test.go'; then
            echo "retired architecture name found" >&2
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Check exhaustive sum types
        run: go tool go-check-sumtype ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test with race detector
        run: go test -race -count=1 ./...

      - name: Build commands
        run: go build ./cmd/...
